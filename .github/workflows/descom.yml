name: DESCOM - Pesquisa e validação

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Rotina a executar"
        required: true
        type: choice
        options:
          - validate
          - search
        default: validate

permissions:
  contents: read

jobs:
  descom:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar base JSON
        if: inputs.action == 'validate'
        run: python scripts/main.py --validate

      - name: Pesquisar candidatos na web
        if: inputs.action == 'search'
        env:
          TAVILY_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python scripts/main.py --search

      - name: Disponibilizar resultados para revisão
        if: always() && inputs.action == 'search' && hashFiles('discovery-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: descom-candidatos-web
          path: discovery-results.json
          if-no-files-found: error
          retention-days: 7
