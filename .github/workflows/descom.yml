name: DESCOM - Descoberta e validação

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Rotina a executar"
        required: true
        type: choice
        options:
          - validate
          - discover
          - triage
          - geography
        default: triage
      region:
        description: "Chave da Região Administrativa em config/regions.json"
        required: true
        type: string
        default: nucleo-bandeirante
      locality:
        description: "Nome da localidade para investigação geográfica"
        required: false
        type: string
        default: ""
      uf:
        description: "UF da localidade"
        required: false
        type: string
        default: "DF"

permissions:
  contents: write

jobs:
  descom:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar descobertas
        if: inputs.action == 'validate'
        run: python scripts/main.py --validate --region "${{ inputs.region }}"

      - name: Descobrir estabelecimentos
        if: inputs.action == 'discover'
        run: python scripts/main.py --discover --region "${{ inputs.region }}"

      - name: Executar triagem automática
        if: inputs.action == 'triage'
        run: python scripts/triage.py --region "${{ inputs.region }}"

      - name: Investigar configuração geográfica
        if: inputs.action == 'geography'
        env:
          LOCALITY: "${{ inputs.locality }}"
          UF: "${{ inputs.uf }}"
        run: |
          if [ -z "$LOCALITY" ]; then
            echo "::error::Informe o nome da localidade."
            exit 1
          fi
          python scripts/geography.py --name "$LOCALITY" --uf "$UF"

      - name: Salvar resultados no repositório
        if: inputs.action == 'discover' || inputs.action == 'triage' || inputs.action == 'geography'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.action }}" = "geography" ]; then
            git add data/geography-pending/
          else
            git add "data/${{ inputs.region }}/descobertas.json" "data/${{ inputs.region }}/triagem.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultados do DESCOM"
            git push
          else
            echo "Nenhuma alteração nos resultados."
          fi

      - name: Disponibilizar arquivo para revisão
        if: always() && inputs.action == 'triage' && hashFiles(format('data/{0}/triagem.json', inputs.region)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: descom-triagem-${{ inputs.region }}
          path: data/${{ inputs.region }}/triagem.json
          if-no-files-found: warn
          retention-days: 7
