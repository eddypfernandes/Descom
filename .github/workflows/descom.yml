name: DESCOM - Descoberta e validação

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Rotina a executar"
        required: true
        type: choice
        options:
          - validate
          - discover
          - triage
        default: triage

permissions:
  contents: write

jobs:
  descom:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar descobertas
        if: inputs.action == 'validate'
        run: python scripts/main.py --validate

      - name: Descobrir estabelecimentos
        if: inputs.action == 'discover'
        run: python scripts/main.py --discover

      - name: Executar triagem automática
        if: inputs.action == 'triage'
        run: python scripts/triage.py

      - name: Salvar resultados no repositório
        if: inputs.action == 'discover' || inputs.action == 'triage'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nucleo-bandeirante/descobertas.json data/nucleo-bandeirante/triagem.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultados do DESCOM"
            git push
          else
            echo "Nenhuma alteração nos resultados."
          fi

      - name: Disponibilizar arquivo para revisão
        if: always() && inputs.action == 'triage' && hashFiles('data/nucleo-bandeirante/triagem.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: descom-triagem-nucleo-bandeirante
          path: data/nucleo-bandeirante/triagem.json
          if-no-files-found: warn
          retention-days: 7
