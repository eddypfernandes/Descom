name: DESCOM - Pesquisa e validação

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Rotina a executar"
        required: true
        type: choice
        options:
          - validate
          - search
        default: validate

permissions:
  contents: write

jobs:
  descom:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar base JSON
        if: inputs.action == 'validate'
        run: python scripts/main.py --validate

      - name: Pesquisar e atualizar arquivos JSON
        if: inputs.action == 'search'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/main.py --search

      - name: Salvar base e carousel no repositório
        if: inputs.action == 'search'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nucleo-bandeirante/estabelecimentos.json carousel/empresas-carousel.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza empresas e carousel do DESCOM"
            git push
          else
            echo "Nenhuma alteração nos dados."
          fi

      - name: Disponibilizar resultados para revisão
        if: always() && inputs.action == 'search' && hashFiles('data/nucleo-bandeirante/estabelecimentos.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: descom-dados-e-carousel
          path: |
            data/nucleo-bandeirante/estabelecimentos.json
            carousel/empresas-carousel.json
          if-no-files-found: warn
          retention-days: 7
