name: Publicar módulo comercial
# Publicação do ambiente provisório em modulo/

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modulo/**"
      - "data/nucleo-bandeirante/estabelecimentos.json"\n      - "carousel/**"
      - ".github/workflows/modulo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        run: |
          mkdir -p site/data/nucleo-bandeirante
          cp -R modulo/. site/
          cp data/nucleo-bandeirante/estabelecimentos.json site/data/nucleo-bandeirante/estabelecimentos.json

      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
