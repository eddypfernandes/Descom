name: Publicar módulo comercial

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modulo/**"
      - "data/nucleo-bandeirante/estabelecimentos.json"
      - ".github/workflows/modulo-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do módulo
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./modulo"

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
